# DnCNN baseline, Phase 1. Gaussian sigma=25 only; the composite archival
# degradation arrives in Phase 2 and gets its own config.
model = "dncnn"
sigma = 25          # in 0-255 units
patch = 128
batch = 16
steps = 300000
lr = 2e-4
lr_min = 1e-6
weight_decay = 0.0
amp = true
workers = 4
log_every = 50
val_every = 2000
ckpt_every = 2000
val_images = 16
# Stop and save before Kaggle's 12h cap kills the session and takes
# /kaggle/working with it. Leaves room for the eval and plot cells.
max_hours = 11.0
