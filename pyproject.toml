[project]
name = "fcsg-net"
version = "0.1.0"
description = "Band-adaptive sparse expert routing for image restoration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lpips>=0.1.4",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "thop>=0.1.1.post2209072238",
    "torch>=2.4",
    "torchvision>=0.19",
    "tqdm>=4.66",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
